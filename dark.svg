    <text x="880" y="504" text-anchor="middle">AWS</text>
    <animate attributeName="opacity"
      values="0;1"
      dur=".35s"
      begin="3.96s"
      fill="freeze"/>
  </g>

  <g class="pill" opacity="0">
    <rect x="924" y="485" width="62" height="28" rx="14"/>
    <text x="955" y="504" text-anchor="middle">Git</text>
    <animate attributeName="opacity"
      values="0;1"
      dur=".35s"
      begin="4.08s"
      fill="freeze"/>
  </g>

  <g class="pill" opacity="0">
    <rect x="996" y="485" width="76" height="28" rx="14"/>
    <text x="1034" y="504" text-anchor="middle">Figma</text>
    <animate attributeName="opacity"
      values="0;1"
      dur=".35s"
      begin="4.20s"
      fill="freeze"/>
  </g>

  <!-- SOCIAL FOOTER -->

  <path
    d="M480 525H1122"
    stroke="rgba(255,255,255,.10)"/>

  <g class="base">

    <!-- GitHub -->
    <g transform="translate(492 546)">
      <circle
        cx="8"
        cy="8"
        r="8"
        class="social"/>

      <path
        d="M4.5 9.5c0-2.8 2-5 4.5-5s4.5 2.2 4.5 5c0 2-1.2 4.1-4.5 4.1S4.5 12.3 4.5 9.5Z"
        class="social"/>

      <text x="24" y="12" class="label">
        GitHub
      </text>
    </g>

    <!-- LinkedIn -->
    <g transform="translate(635 546)">
      <rect
        x="1"
        y="1"
        width="14"
        height="14"
        rx="2"
        class="social"/>

      <text x="24" y="12" class="label">
        LinkedIn
      </text>
    </g>

    <!-- Twitter -->
    <g transform="translate(790 546)">
      <path
        d="M1 3l6 5.2L14 2M2 14L7 9M14 14L9 9"
        class="social"/>

      <text x="24" y="12" class="label">
        Twitter
      </text>
    </g>

    <!-- Portfolio -->
    <g transform="translate(930 546)">
      <circle
        cx="8"
        cy="8"
        r="7"
        class="social"/>

      <path
        d="M1 8h14M8 1c2 2 2 12 0 14M8 1c-2 2-2 12 0 14"
        class="social"/>

      <text x="24" y="12" class="label">
        Portfolio
      </text>
    </g>

  </g>

  <!-- Moving scanline -->

  <rect
    x="25"
    y="35"
    width="1130"
    height="1.5"
    fill="url(#accent)"
    opacity=".13">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 540;0 0"
      dur="6s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Glass reflection -->

  <path
    d="M35 50 Q300 20 570 50 T1145 50
       L1145 85 Q850 55 570 85 T35 85Z"
    fill="white"
    opacity=".018">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="-20 0;20 0;-20 0"
      dur="10s"
      repeatCount="indefinite"/>
